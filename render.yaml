services:
  - type: static
    name: magiccoffee-ui
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://magiccoffee-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
